<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptitudes ERP</title>
<script src="page-turn.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="abilities.css">
</head>
<body class="erp-page">
<div class="app">
  <header class="hero">
    <svg class="hero-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 4.5h6.5a2 2 0 0 1 1.5.7 2 2 0 0 1 1.5-.7H20v14h-6.5a2 2 0 0 0-1.5.7 2 2 0 0 0-1.5-.7H4Z"/>
      <path d="M12 5.2v14.5"/>
    </svg>
    <h1>Aptitudes ERP</h1>
    <p>Les aptitudes liées au jeu de rôle érotique</p>
    <div class="hero-rule"><span class="diamond"></span></div>
    <nav class="hero-links" aria-label="Pages">
      <a class="back-link" href="index.html">Simulateur d'Attributs</a>
      <a class="back-link" href="abilities.html">Encyclopédie des Aptitudes</a>
      <a class="back-link erp-link" href="abilities-erp.html" aria-current="page">Aptitudes ERP</a>
    </nav>
    <div class="legend" id="legend"></div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="tb-row">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search" id="search" type="search" placeholder="Rechercher : nom, n°, statut, dégâts, source…" autocomplete="off" aria-label="Rechercher une aptitude">
        <kbd>/</kbd>
      </label>
      <div class="seg" role="group" aria-label="Affichage">
        <button type="button" data-view="cards" aria-pressed="true" title="Vue en fiches">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/></svg><span>Fiches</span>
        </button>
        <button type="button" data-view="table" aria-pressed="false" title="Vue en tableau, pour comparer ligne à ligne">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9.5h18M3 15h18M9 4v16"/></svg><span>Tableau</span>
        </button>
      </div>
      <label class="check"><input type="checkbox" id="only-undoc"> Seulement les non documentées</label>
      <div class="counter" id="counter" aria-live="polite"></div>
    </div>
    <div class="tb-row tb-nav">
      <button type="button" class="btn" id="filters-toggle" aria-expanded="false" aria-controls="filter-panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5Z"/></svg>
        Filtres <span class="badge" id="filters-badge" hidden></span>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="tabs" id="tabs" role="tablist" aria-label="Catégories"></div>
    </div>
    <div class="tb-row" id="af-row" hidden>
      <div class="active-filters" id="active-filters"></div>
    </div>
    <div class="filter-panel" id="filter-panel" hidden></div>
  </div>

  <div class="layout" id="layout">
    <nav class="toc" id="toc" aria-label="Sommaire"></nav>
    <main id="content"></main>
  </div>
</div>

<div class="tray" id="tray" hidden></div>

<dialog class="cmp-dialog" id="cmp-dialog" aria-labelledby="cmp-title">
  <div class="dlg-head">
    <h2 id="cmp-title">Comparaison</h2>
    <label class="check"><input type="checkbox" id="cmp-diff"> Seulement les différences</label>
    <button type="button" class="btn ghost" id="cmp-clear">Vider</button>
    <button type="button" class="btn primary" id="cmp-close">Fermer</button>
  </div>
  <div class="dlg-body" id="cmp-body"></div>
</dialog>

<script src="data.js"></script>
<script src="abilities-erp.js"></script>
<script>window.ENCYCLO_MODE = 'erp';</script>
<script src="abilities.js"></script>
</body>
</html>
