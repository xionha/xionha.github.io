<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encyclopédie des Aptitudes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0806;
    --bg-vignette:
      radial-gradient(ellipse 900px 500px at 50% -8%, #2a1d10 0%, transparent 60%),
      radial-gradient(ellipse 1200px 800px at 100% 100%, #1a1109 0%, transparent 55%),
      linear-gradient(180deg, #100b07 0%, #0a0806 100%);
    --surface: #18120c;
    --surface-2: #221a12;
    --surface-3: #2a2016;
    --border: #3a2c1c;
    --border-bright: #7a5a2e;
    --text: #ecdfc0;
    --text-dim: #c4ae83;
    --text-faint: #93815f;
    --bronze: #bd7d3f;
    --bronze-bright: #e8b168;
    --gold: #d9b25c;
    --vitales: #9c3225;
    --mobilite: #6f8a45;
    --combat: #c0672f;
    --defense: #7c8ea3;
    --magie: #4d84a3;
    --erp: #a8507a;
    --ps: #b48ae0;
    --mobilite-bright: #9dbd6a;
    --magie-bright: #6fb0d4;
    --vitales-bright: #e8776a;
    --combat-bright: #e08a4f;
    --defense-bright: #a7b8cc;
    --dmg-contondant: #c9a77a;
    --dmg-tranchant: #d8d2c4;
    --dmg-perforant: #9fb6cc;
    --shadow-deep: rgba(0,0,0,0.6);
    --font-display: 'Cinzel', Georgia, serif;
    --font-deco: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
    --font-body: 'EB Garamond', Georgia, 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg-vignette), var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 36px 20px 60px;
    position: relative;
  }

  /* grain texture overlay, self-contained (no external images) */
  body::before{
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    z-index: 0;
    opacity: 0.5;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
  }

  .app{ max-width: 1480px; margin: 0 auto; position: relative; z-index: 1; }

  header{
    text-align:center;
    margin-bottom: 30px;
    padding: 8px 20px 22px;
    position: relative;
  }
  .hero-glyph{
    width: 46px; height: 46px;
    margin: 0 auto 6px;
    color: var(--bronze-bright);
    opacity: 0.9;
  }
  h1{
    font-family: var(--font-deco);
    font-size: 34px;
    letter-spacing: 6px;
    text-transform: uppercase;
    font-weight: 700;
    background: linear-gradient(180deg, var(--bronze-bright) 10%, var(--bronze) 55%, #a9723a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 24px rgba(232,177,104,0.18);
    margin: 0 0 10px;
  }
  header p{
    color: var(--text-dim);
    font-style: italic;
    font-size: 15px;
    margin: 0;
    letter-spacing: 0.6px;
  }
  .hero-rule{
    display:flex; align-items:center; justify-content:center; gap:14px;
    max-width: 420px; margin: 14px auto 0;
  }
  .hero-rule::before, .hero-rule::after{
    content:"";
    height:1px; flex:1 1 auto;
    background: linear-gradient(90deg, transparent, var(--border-bright));
  }
  .hero-rule::after{ background: linear-gradient(90deg, var(--border-bright), transparent); }
  .hero-rule .diamond{
    width:7px; height:7px; flex-shrink:0;
    background: var(--bronze-bright);
    transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(232,177,104,0.55);
  }
  .back-link{
    display:inline-block;
    margin-top: 14px;
    font-family: var(--font-display);
    font-size: 11.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--border-bright);
    background: var(--surface-2);
    padding: 7px 16px;
    transition: all 0.2s ease;
  }
  .back-link:hover{ color: var(--bronze-bright); border-color: var(--bronze-bright); background: rgba(189,125,63,0.12); }

  /* ---- Barre d'outils : recherche + filtres ---- */
  .toolbar{
    display:flex; align-items:center; gap: 14px; flex-wrap: wrap;
    margin-bottom: 22px;
    padding: 12px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 8px 24px var(--shadow-deep);
  }
  .search{
    flex: 1 1 260px;
    min-width: 0;
    background: var(--surface-2);
    border: 1px solid var(--border-bright);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    padding: 8px 12px;
    outline: none;
  }
  .search:focus{ border-color: var(--bronze-bright); }
  .search::placeholder{ color: var(--text-faint); font-style: italic; }
  .chips{ display:flex; flex-wrap: wrap; gap: 6px; }
  .chip{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 7px 11px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip:hover{ border-color: var(--border-bright); color: var(--text); }
  .chip.active{ border-color: var(--cat, var(--bronze-bright)); color: var(--cat, var(--bronze-bright)); background: rgba(189,125,63,0.12); }
  .counter{
    font-family: var(--font-mono);
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .counter b{ color: var(--bronze-bright); }

  .layout{
    display:grid;
    grid-template-columns: 250px 1fr;
    gap: 26px;
    align-items: start;
  }
  @media (max-width: 960px){
    .layout{ grid-template-columns: 1fr; }
    .toc{ display:none; }
  }

  /* ---- Sommaire latéral ---- */
  .toc{
    position: sticky; top: 84px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 14px 10px;
    font-size: 14.5px;
  }
  .toc-cat{
    display:block;
    font-family: var(--font-display);
    font-size: 11.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cat);
    text-decoration: none;
    margin: 10px 0 4px;
  }
  .toc-cat:first-child{ margin-top: 0; }
  .toc-group{
    display:flex; justify-content: space-between; gap: 8px;
    color: var(--text-dim);
    text-decoration: none;
    padding: 2px 0 2px 10px;
    border-left: 1px solid var(--border);
  }
  .toc-group:hover{ color: var(--text); border-left-color: var(--cat); }
  .toc-group span{ color: var(--text-faint); font-family: var(--font-mono); font-size: 12px; }

  /* ---- Catégories & groupes ---- */
  .category{ margin-bottom: 34px; scroll-margin-top: 84px; }
  .category-title{
    font-family: var(--font-deco);
    font-size: 21px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cat);
    margin: 0 0 4px;
    display:flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .category-title small{
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--text-faint);
    text-transform: none;
  }
  .category-desc{ color: var(--text-dim); font-style: italic; margin: 0 0 16px; }

  .group{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 16px 18px 14px;
    margin-bottom: 16px;
    position: relative;
    box-shadow: 0 8px 24px var(--shadow-deep);
    scroll-margin-top: 84px;
  }
  /* ornements d'angle en bronze — signature visuelle des tablettes */
  .group::before, .group::after{
    content:"";
    position:absolute;
    width: 13px; height: 13px;
    pointer-events:none;
    opacity: 0.85;
    top:-1px;
    border-top: 2px solid var(--border-bright);
  }
  .group::before{ left:-1px; border-left: 2px solid var(--border-bright); }
  .group::after{ right:-1px; border-right: 2px solid var(--border-bright); }
  .group-title{
    font-family: var(--font-display);
    font-size: 13.5px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--bronze-bright);
    margin: 0 0 12px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border);
    display:flex; justify-content: space-between; gap: 8px;
  }
  .group-title span{ font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); letter-spacing: 0; }
  .group-desc{ color: var(--text-dim); font-style: italic; font-size: 14.5px; margin: -4px 0 12px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }

  /* ---- Fiche d'aptitude ---- */
  .ability{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--cat);
    padding: 10px 12px 9px;
    scroll-margin-top: 90px;
    min-width: 0;
  }
  .ability:target{ border-color: var(--bronze-bright); box-shadow: 0 0 0 1px var(--bronze-bright), 0 0 18px rgba(232,177,104,0.25); }
  .ability-head{ display:flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 8px; }
  .ability-name{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 0.5px;
    color: var(--text);
    overflow-wrap: break-word;
    flex: 1 1 9em;
    min-width: 0;
  }
  .ability-id{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    text-decoration: none;
    flex-shrink: 0;
  }
  .ability-id:hover{ color: var(--bronze-bright); }
  .ability-desc{ margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: var(--text); }
  .ability-desc.todo{ color: var(--text-faint); font-style: italic; font-size: 14px; }
  .meta{ margin: 7px 0 0; display:grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
  .meta dt{ color: var(--text-faint); font-family: var(--font-display); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; padding-top: 3px; }
  .meta dd{ margin: 0; color: var(--text-dim); }
  .tag{
    display:inline-block;
    font-size: 12.5px;
    font-style: italic;
    color: var(--text-dim);
    background: rgba(122,107,78,0.14);
    border: 1px solid rgba(122,107,78,0.4);
    border-radius: 3px;
    padding: 0 7px;
    margin: 2px 4px 2px 0;
  }
  .ability-side{ display:flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 4px 6px; margin-left: auto; }
  .cost{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--c);
    border: 1px solid var(--c);
    background: color-mix(in srgb, var(--c) 14%, transparent);
    border-radius: 10px;
    padding: 1px 8px;
    white-space: nowrap;
  }
  .cost-row{ display:inline-flex; flex-wrap: wrap; gap: 4px; padding-top: 1px; }
  .conditions{ margin: 0; padding-left: 16px; }
  .conditions li{ margin: 1px 0; }
  .conditions li::marker{ color: var(--bronze); }
  .usage{
    display:flex; flex-wrap: wrap; gap: 5px;
    margin-top: 7px;
  }
  .u-chip{
    display:inline-flex; align-items:center; gap: 5px;
    font-size: 13.5px;
    color: var(--text);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 8px 2px 6px;
    line-height: 1.3;
  }
  .u-chip svg{ width: 14px; height: 14px; flex-shrink: 0; color: var(--u, var(--text-dim)); }
  .u-chip .u-label{
    font-family: var(--font-display);
    font-size: 9.5px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .u-chip.type{ --u: var(--bronze-bright); font-family: var(--font-display); font-size: 12px; letter-spacing: 0.8px; }
  .u-chip.range{ --u: #8fc7c0; }
  .u-chip.target{ --u: #e0b07a; }
  .u-chip.cooldown{ --u: #b9a4d6; }
  .pill{
    display:inline-block;
    font-size: 13px;
    font-weight: 600;
    color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
    background: color-mix(in srgb, var(--c) 12%, transparent);
    border-radius: 3px;
    padding: 0 7px;
    margin: 2px 4px 2px 0;
  }
  .pill.status{ --c: var(--vitales-bright); }
  .pill.status.removed{ --c: var(--text-dim); text-decoration: line-through; }
  .status-effects{ display:inline; margin-left: 2px; }
  .status-effects .pill{ font-size: 12px; font-weight: 500; }
  .pill.pos{ --c: #9fd07a; }
  .pill.neg{ --c: #ff9c8f; }
  .tag b{ font-style: normal; font-weight: 600; color: var(--bronze-bright); margin-right: 3px; }
  .tag.link{ text-decoration: none; font-style: normal; color: var(--text); }
  .tag.link:hover{ border-color: var(--bronze-bright); color: var(--bronze-bright); }
  .pill.status::before{ content: "◆ "; font-size: 9px; vertical-align: 2px; }
  .legend{
    display:flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px;
    margin-top: 14px;
    font-size: 13.5px; color: var(--text-dim);
  }
  .legend span{ display:inline-flex; align-items:center; gap: 5px; }
  .tag.verify{ color: var(--gold); border-color: rgba(217,178,92,0.45); background: rgba(217,178,92,0.08); }

  .empty{
    text-align:center;
    color: var(--text-faint);
    font-style: italic;
    padding: 40px 0;
  }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="hero-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4.5h6.5a2 2 0 0 1 1.5.7 2 2 0 0 1 1.5-.7H20v14h-6.5a2 2 0 0 0-1.5.7 2 2 0 0 0-1.5-.7H4Z"/>
      <path d="M12 5.2v14.5"/>
    </svg>
    <h1>Encyclopédie des Aptitudes</h1>
    <p>Toutes les aptitudes du jeu, classées par usage</p>
    <div class="hero-rule"><span class="diamond"></span></div>
    <a class="back-link" href="index.html">← Simulateur d'Attributs</a>
    <div class="legend" id="legend"></div>
  </header>

  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="Rechercher une aptitude (nom ou n°)…" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="counter" id="counter"></div>
  </div>

  <div class="layout">
    <nav class="toc" id="toc"></nav>
    <main id="content"></main>
  </div>
</div>

<script src="data.js"></script>
<script>
// ============================================================================

// options possibles :

// La documentation détaillée se remplit dans DETAILS (plus bas), indexée par n°.
// ============================================================================

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// recherche insensible aux accents et à la casse
function norm(s){
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}
function slug(s){
  return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

  640: ['CONSUMABLES', 'Alcool doux'], 642: ['CONSUMABLES', 'Spiritueux (Alcool Fort)'],
  622: ['CONSUMABLES', 'Récréatif'], 623: ['CONSUMABLES', 'Dopant Psychique'], 624: ['CONSUMABLES', 'Dopant Physique'],
  1044: ['CONSUMABLES', 'Parfum (Sent Bon)'], 1602: ['CONSUMABLES', 'Cosmétique (Maquillage)'], 1601: ['CONSUMABLES', 'Savon (Propre)'], 1885: ['CONSUMABLES', 'Cosmétique (Maquillage)'],
};
const DATA_COLLECTIONS = { POSTURES, TRANSFORMATIONS, TRANSFORMATIONS_CHANGEFORME, CONSUMABLES };

// Libellés des stats pour l'affichage des effets
const ATTR_LABELS = Object.fromEntries(ATTRIBUTES.map(a => [a.key, a.label]));
function statLabel(k){
  return TALENT_STAT_LABELS[k] || STATS[k] || PARENT_LABELS_SHORT[k] || ATTR_LABELS[k]
    || EXTRA_STATS[k] || OTHER_STATS[k] || ELEMENTAL_STATS[k] || k;
}

// Clé de comparaison des noms d'aptitude (accents, casse, ligatures et espaces ignorés)
function nameKey(s){
  return norm(String(s).replace(/œ/g, 'oe').replace(/Œ/g, 'Oe')).replace(/\s+/g, ' ').trim();
}
// Noms utilisés dans le simulateur qui diffèrent du nom en jeu
const NAME_ALIASES = {
  'couper les liens': 'couper liens',
  'sacrifice invocation occulte': 'sacrifice de troupe (invocation occulte)',
};

const ABILITY_BY_KEY = {};
CATEGORIES.forEach(c => c.groups.forEach(g => g.abilities.forEach(([id, name]) => { ABILITY_BY_KEY[nameKey(name)] = id; })));
function abilityIdFor(name){
  const k = nameKey(name);
  return ABILITY_BY_KEY[NAME_ALIASES[k] || k];
}

// Notes du simulateur : 'Octroie : X' (aptitude) et 'Octroie le statut : X'
function grantedAbilities(notes){ return (notes || []).map(n => /^Octroie\s*:\s*(.+)$/.exec(n)).filter(Boolean).map(m => m[1]); }
function grantedStatuses(notes){ return (notes || []).map(n => /^Octroie le statut\s*:\s*(.+)$/i.exec(n)).filter(Boolean).map(m => m[1]); }

// Index inverse : pour chaque aptitude, ce qui l'octroie dans le simulateur
const GRANTED_BY = {};
const UNMATCHED_GRANTS = new Set();
function addGrant(abilityName, kind, label){
  const id = abilityIdFor(abilityName);
  if (!id) { UNMATCHED_GRANTS.add(abilityName); return; }
  const list = GRANTED_BY[id] = GRANTED_BY[id] || [];
  if (!list.some(x => x.kind === kind && x.label === label)) list.push({ kind, label });
}
function indexSource(kind, entries){
  Object.entries(entries).forEach(([key, data]) => grantedAbilities(data.notes).forEach(a => addGrant(a, kind, key)));
}
Object.entries(EQUIPMENT).forEach(([slot, items]) => {
  Object.entries(items).forEach(([item, data]) => {
    // perk principal de l'arme (ex. « Lames 1M »), hors perks génériques
    const perk = (data.notes || []).map(n => /^Octroie le Perk\s*:\s*(.+)$/.exec(n)).filter(Boolean).map(m => m[1])
      .find(p => !['Arme', 'Deux Mains'].includes(p));
    const label = perk && perk !== item ? `${item} (${perk})` : item;
    grantedAbilities(data.notes).forEach(a => addGrant(a, SLOT_LABELS[slot] || slot, label));
  });
});
indexSource('Espèce', SPECIES);
indexSource('Malédiction', CURSES);
indexSource('Corruption', CORRUPTION);
indexSource('Transformation', TRANSFORMATIONS);
indexSource('Changeforme', TRANSFORMATIONS_CHANGEFORME);
indexSource('Statut', STATUSES);
indexSource('Consommable', CONSUMABLES);
indexSource('Environnement', ENVIRONMENTS);
grantedAbilities(TENERIFFE.notes).forEach(a => addGrant(a, 'Lignée', 'Ténériffe'));
grantedAbilities(ESCLAVE.notes).forEach(a => addGrant(a, 'Statut', 'Esclave'));
TALENTS.forEach(t => grantedAbilities(t.notes).forEach(a => addGrant(a, 'Talent', t.name)));
// les formes du Changeforme nécessitent le talent du même nom
Object.entries(DATA_LINKS).forEach(([id, [coll]]) => {
  if (coll === 'TRANSFORMATIONS_CHANGEFORME') (GRANTED_BY[id] = GRANTED_BY[id] || []).push({ kind: 'Talent', label: 'ChangeForme' });
});
if (UNMATCHED_GRANTS.size) console.warn('Aptitudes du simulateur introuvables dans l\'encyclopédie :', [...UNMATCHED_GRANTS]);

// Effets chiffrés d'une entrée du simulateur, en pastilles vertes / rouges
function dataEffects(data){
  const entries = [];
  ['parentDelta', 'attrDelta', 'flatStats', 'extraStats', 'otherStats', 'elemental'].forEach(field => {
    Object.entries(data[field] || {}).forEach(([k, v]) => { if (v) entries.push([statLabel(k), v]); });
  });
  return entries.map(([label, v]) =>
    `<span class="pill ${v > 0 ? 'pos' : 'neg'}">${esc(label)} ${v > 0 ? '+' : ''}${v}</span>`).join('');
}
// Statut appliqué + ses effets s'il existe dans le simulateur (statuts, puis buffs de consommation).
// Une durée entre parenthèses est ignorée pour la recherche : « Bon repos (20 h) » -> « Bon repos »
function statusHTML(name){
  const k = nameKey(name.replace(/\s*\([^)]*\)\s*$/, ''));
  const src = [STATUSES, CONSUMABLES].map(c => Object.entries(c).find(([key]) => nameKey(key) === k)).find(Boolean);
  const effects = src ? dataEffects(src[1]) : '';
  return `<span class="pill status">${esc(name)}</span>${effects ? `<span class="status-effects">${effects}</span>` : ''}`;
}
function abilityLink(name){
  const id = abilityIdFor(name);
  return id ? `<a class="tag link" href="#a${id}">${esc(name)}</a>` : `<span class="tag">${esc(name)}</span>`;
}

// Pictogrammes de la ligne d'usage (type, portée, cible)
const ICONS = {
  type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/></svg>',
  range: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 12l4-4M3 12l4 4M21 12l-4-4M21 12l-4 4"/></svg>',
  cooldown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
};

// Ressources dépensées : libellé complet (infobulle) + couleur
const COSTS = {
  PA: { label: "Points d'Action", color: 'var(--gold)' },
  PS: { label: 'Action Spéciale', color: 'var(--ps)' },
  PM: { label: 'Points de Mouvement', color: 'var(--mobilite-bright)' },
  Mana: { label: 'Mana', color: 'var(--magie-bright)' },
  PV: { label: 'Points de Vie', color: 'var(--vitales-bright)' },
  AT: { label: 'Action de Troupe', color: 'var(--defense-bright)' },
  Posture: { label: 'Posture', color: 'var(--combat-bright)' },
  'Hygiène': { label: 'Hygiène', color: '#7cc7b8' },
  'Santé mentale': { label: 'Santé mentale', color: '#d79ad0' },
};
// Types de dégâts : couleur par mot-clé (la première correspondance l'emporte)
const DAMAGE_COLORS = [
  [/magi/i, 'var(--magie-bright)'],
  [/physi/i, 'var(--combat-bright)'],
  [/contond/i, 'var(--dmg-contondant)'],
  [/tranch/i, 'var(--dmg-tranchant)'],
  [/per[cf]/i, 'var(--dmg-perforant)'],
];
function damageColor(t){
  const m = DAMAGE_COLORS.find(([re]) => re.test(t));
  return m ? m[1] : 'var(--text-dim)';
}

function abilityHTML([id, name, opts = {}]){
  const d = DETAILS[id] || {};
  const link = DATA_LINKS[id];
  const linked = link ? DATA_COLLECTIONS[link[0]][link[1]] : null;
  const costs = Object.entries(d.cout || {}).map(([k, v]) => {
    const c = COSTS[k] || { label: k, color: 'var(--text-dim)' };
    return `<span class="cost" style="--c:${c.color}" title="${esc(c.label)}">${esc(v)} ${esc(k)}</span>`;
  }).join('');
  const usage = [
    d.type && `<span class="u-chip type">${ICONS.type}${esc(d.type)}</span>`,
    d.portee && `<span class="u-chip range" title="Portée">${ICONS.range}<span class="u-label">Portée</span>${esc(d.portee)}</span>`,
    d.cible && `<span class="u-chip target" title="Cible">${ICONS.target}<span class="u-label">Cible</span>${esc(d.cible)}</span>`,
    d.cooldown && `<span class="u-chip cooldown" title="Temps de recharge">${ICONS.cooldown}<span class="u-label">Cooldown</span>${esc(d.cooldown)}</span>`,
  ].filter(Boolean).join('');
  const statuses = [...(d.statuts || []), ...(linked ? grantedStatuses(linked.notes) : [])];
  const grants = linked ? grantedAbilities(linked.notes) : [];
  const sources = [
    ...(GRANTED_BY[id] || []).map(x => `<span class="tag"><b>${esc(x.kind)}</b> ${esc(x.label)}</span>`),
    ...(d.sources || []).map(t => `<span class="tag">${esc(t)}</span>`),
  ];
  const effectsHTML = linked ? dataEffects(linked) : '';

  const rows = [];
  // les dégâts d'arme (tranchants, perforants, contondants) sont toujours aussi des dégâts physiques
  const degats = [...(d.degats || [])];
  if (degats.some(t => /contond|tranch|per[cf]/i.test(t)) && !degats.some(t => /physi/i.test(t))) degats.push('Physiques');
  const recharge = Object.entries(d.recharge || {}).map(([k, v]) => {
    const c = COSTS[k] || { label: k, color: 'var(--text-dim)' };
    // nombre -> « 1/1 » ; texte -> affiché tel quel (ex. maximum variable)
    const val = typeof v === 'number' ? `${v}/${v}` : v;
    return `<span class="cost" style="--c:${c.color}" title="${esc(c.label)}">${esc(k)} ${esc(val)}</span>`;
  }).join(' ');
  if (recharge) rows.push(['Recharge', `<span class="cost-row">${recharge}</span>`]);
  const gain = Object.entries(d.gain || {}).map(([k, v]) => {
    const c = COSTS[k] || { label: k, color: 'var(--text-dim)' };
    return `<span class="cost" style="--c:${c.color}" title="${esc(c.label)}">+${esc(v)} ${esc(k)}</span>`;
  }).join(' ');
  if (gain) rows.push(['Rend', `<span class="cost-row">${gain}</span>`]);
  if (degats.length) rows.push(['Dégâts', degats.map(t => `<span class="pill" style="--c:${damageColor(t)}">${esc(t)}</span>`).join('')]);
  if (effectsHTML) rows.push(['Effets', effectsHTML]);
  if (d.retire && d.retire.length) rows.push(['Retire', d.retire.map(t => `<span class="pill status removed">${esc(t)}</span>`).join('')]);
  if (statuses.length) rows.push(['Statut', statuses.map(statusHTML).join('<br>')]);
  if (grants.length) rows.push(['Octroie', grants.map(abilityLink).join('')]);
  if (d.jet) rows.push(['Jet', esc(d.jet)]);
  if (d.conditions && d.conditions.length) rows.push(['Conditions', `<ul class="conditions">${d.conditions.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`]);
  // effets en texte libre : liste à puces (« Autres effets » si des effets chiffrés sont déjà affichés)
  if (d.effets && d.effets.length) rows.push([effectsHTML ? 'Autres effets' : 'Effets',
    `<ul class="conditions">${d.effets.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`]);
  if (sources.length) rows.push(['Obtenue via', sources.join('')]);
  Object.entries(d.affiche || {}).forEach(([tab, items]) =>
    rows.push([esc(tab), items.map(i => `<span class="tag">${esc(i)}</span>`).join('')]));
  if (d.menus && d.menus.length) rows.push(['Sous-menus', d.menus.map(m => `<span class="tag">${esc(m)}</span>`).join('')]);
  if (d.notes) rows.push(['Notes', esc(d.notes)]);

  // « À documenter » tant qu'il n'y a ni description, ni coût, ni usage, ni effet connu
  const documented = d.affiche || (d.menus && d.menus.length) || d.desc || usage || costs || recharge || gain || (d.retire && d.retire.length) || degats.length || effectsHTML || statuses.length || grants.length;
  const searchText = [name, id, d.desc, d.type, ...degats, ...statuses, ...grants,
    ...(GRANTED_BY[id] || []).map(x => x.kind + ' ' + x.label), ...(d.sources || [])].filter(Boolean).join(' ');
  return `
    <article class="ability" id="a${id}" data-search="${esc(norm(searchText))}">
      <div class="ability-head">
        <span class="ability-name">${esc(name)}</span>
        <span class="ability-side">${costs}<a class="ability-id" href="#a${id}" title="Lien direct">#${id}</a></span>
      </div>
      ${usage ? `<div class="usage">${usage}</div>` : ''}
      ${d.desc ? `<p class="ability-desc">${esc(d.desc)}</p>` : ''}
      ${documented ? '' : `<p class="ability-desc todo">À documenter</p>`}
      ${rows.length ? `<dl class="meta">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
      ${opts.verify ? `<span class="tag verify">Classement à vérifier</span>` : ''}
    </article>`;
}

function render(){
  let html = '';
  let tocHtml = '';
  CATEGORIES.forEach(cat => {
    const count = cat.groups.reduce((s, g) => s + g.abilities.length, 0);
    html += `<section class="category" id="${cat.key}" data-cat="${cat.key}" style="--cat:${cat.color}">
      <h2 class="category-title">${esc(cat.label)} <small>${count} aptitudes</small></h2>
      <p class="category-desc">${esc(cat.desc)}</p>`;
    tocHtml += `<div data-cat="${cat.key}" style="--cat:${cat.color}"><a class="toc-cat" href="#${cat.key}">${esc(cat.label)}</a>`;
    cat.groups.forEach(g => {
      const gid = `${cat.key}-${slug(g.label)}`;
      html += `<div class="group" id="${gid}" style="--cat:${cat.color}">
        <div class="group-title">${esc(g.label)} <span>${g.abilities.length}</span></div>
        ${g.desc ? `<p class="group-desc">${esc(g.desc)}</p>` : ''}
        <div class="grid">${g.abilities.map(abilityHTML).join('')}</div>
      </div>`;
      tocHtml += `<a class="toc-group" href="#${gid}">${esc(g.label)} <span>${g.abilities.length}</span></a>`;
    });
    html += `</section>`;
    tocHtml += `</div>`;
  });
  html += `<p class="empty" id="empty" hidden>Aucune aptitude ne correspond à la recherche.</p>`;
  content.innerHTML = html;
  toc.innerHTML = tocHtml;

  chipsEl.innerHTML = `<button class="chip active" data-cat="all">Toutes</button>`
    + CATEGORIES.map(c => `<button class="chip" data-cat="${c.key}" style="--cat:${c.color}">${esc(c.label)}</button>`).join('');
}

function applyFilters(){
  const q = norm(searchEl.value.trim());
  let shown = 0;
  let total = 0;
  content.querySelectorAll('.category').forEach(sec => {
    const catOk = activeCat === 'all' || sec.dataset.cat === activeCat;
    let secShown = 0;
    sec.querySelectorAll('.group').forEach(g => {
      let gShown = 0;
      g.querySelectorAll('.ability').forEach(a => {
        total++;
        const ok = catOk && (!q || a.dataset.search.includes(q));
        a.hidden = !ok;
        if (ok) gShown++;
      });
      g.hidden = gShown === 0;
      secShown += gShown;
    });
    sec.hidden = secShown === 0;
    shown += secShown;
  });
  toc.querySelectorAll('[data-cat]').forEach(t => {
    t.hidden = !(activeCat === 'all' || t.dataset.cat === activeCat);
  });
  document.getElementById('empty').hidden = shown !== 0;
  const documented = Object.keys(DETAILS).length;
  counterEl.innerHTML = `<b>${shown}</b> / ${total} aptitudes · ${documented} documentées`;
}

chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  chipsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === btn));
  applyFilters();
});
searchEl.addEventListener('input', applyFilters);

document.getElementById('legend').innerHTML = Object.entries(COSTS)
  .map(([k, c]) => `<span><span class="cost" style="--c:${c.color}">${k}</span>${esc(c.label)}</span>`).join('')
  + `<span><span class="pill status">Statut</span>appliqué à la cible</span>`;

render();
applyFilters();
</script>
</body>
</html>
